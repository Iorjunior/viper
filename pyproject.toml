[project]
name = "viper"
version = "0.1.0"
description = "Local-first AI media processing platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # API
    "fastapi>=0.138",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
    "websockets>=13.0",
    "httpx>=0.28",
    "mcp>=2.2",
    # DB
    "sqlmodel>=0.0.21",
    "alembic>=1.13",
    "aiosqlite>=0.20",
    # Config
    "pydantic>=2.0",
    "python-decouple>=3.8",
    # AI — platform-agnostic
    "torch>=2.6",
    "torchaudio>=2.6",
    "faster-whisper>=1.0",
    "kokoro>=0.9",
    "soundfile>=0.12",
    "demucs>=4.1",
    "yt-dlp>=2025.1",
    "tqdm>=4.70",
    "openai>=1.0",
    "greenlet>=3.5.6",
]

[project.optional-dependencies]
apple  = ["mlx-lm>=0.31", "mlx-whisper>=0.4"]
dev    = ["pytest>=8.0", "pytest-asyncio>=0.24", "pytest-cov>=5.0", "ruff>=0.8", "pyright>=1.1"]

[project.scripts]
viper-server = "viper.main:serve"
viper-worker = "viper.worker.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/viper"]

[tool.uv]
override-dependencies = [
    "torch>=2.6",
    "torchaudio>=2.6",
]

[tool.ruff]
line-length = 79
target-version = "py312"
extend-exclude = ['migrations']

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PL', 'PT']

[tool.ruff.lint.per-file-ignores]
'tests/*' = ['PLR2004', 'PLR6301']



[tool.ruff.format]
preview = true
quote-style = 'single'

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ['-p', 'no:warnings', '--cov=viper', '--cov-context=test']
