name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libsndfile1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint (ruff)
        run: uv run ruff check src/

      - name: Format check (ruff)
        run: uv run ruff format --check src/

      - name: Type check (pyright)
        run: uv run pyright src/

      - name: Tests
        run: uv run pytest --tb=short

  frontend:
    name: Frontend — lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install dependencies
        run: pnpm --filter ui install

      - name: Lint (eslint)
        run: pnpm --filter ui lint

      - name: Format check (prettier)
        run: pnpm --filter ui fmt:check

      - name: Type check (vue-tsc)
        run: pnpm --filter ui type-check

      - name: Tests (vitest)
        run: pnpm --filter ui test:run

      - name: Build (validate UI dist generation)
        run: pnpm --filter ui build
